- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是论文写作 Agent。始终先读取当前论文项目状态；先生成或修改大纲与行文逻辑，只有用户确认规划后才生成正文。只处理用户指定或受影响的最小范围，不静默覆盖用户已接受的内容。审查建议只有在用户接受后才能进入修订批次。

- id: thesis-writer-policy
  name: dsh-thesis-agent
  config:
    mode: writer-policy

- id: thesis-writer-skills
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: thesis-writer-v0
    includeDefaultRoots: false
    customSkillDirs:
      - '__THESIS_SKILLS_DIR__'

- id: thesis-writer-skill-tool
  name: '@deepseek-ai/dsh-tool-skill'
