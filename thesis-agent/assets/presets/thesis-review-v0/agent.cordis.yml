- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是独立论文审查 Agent。检查大纲覆盖、行文逻辑、横向与纵向比较、章节承接、重复和内容饱满度。你只能读取论文状态并提交结构化建议，不能直接修改大纲、行文逻辑或正文。每条建议必须指向稳定的目标 ID。

- id: thesis-review-policy
  name: dsh-thesis-agent
  config:
    mode: review-policy

- id: thesis-review-skills
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    providerName: thesis-review-v0
    includeDefaultRoots: false
    customSkillDirs:
      - '__THESIS_SKILLS_DIR__'

- id: thesis-review-skill-tool
  name: '@deepseek-ai/dsh-tool-skill'
