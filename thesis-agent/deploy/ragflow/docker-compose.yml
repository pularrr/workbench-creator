# RAGFlow Core Stack for thesis-agent (P3 · v1.0)
#
# Minimal deployment of RAGFlow's core retrieval components:
#   - PostgreSQL 15 (metadata + full-text search)
#   - Qdrant (vector storage)
#   - Redis (caching)
#   - MinIO (document/object storage)
#   - RAGFlow API (document parsing + retrieval)
#
# Usage:
#   cd deploy/ragflow
#   docker compose up -d
#   # API available at http://127.0.0.1:9380
#   # Set RAGFLOW_ENDPOINT=http://127.0.0.1:9380 and RAGFLOW_API_KEY=<key>
#
# The thesis-agent plugin can use this stack via:
#   createRagflowAdapter({ backend: 'ragflow', endpoint: 'http://127.0.0.1:9380', apiKey: '...' })

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: thesis-ragflow-postgres
    environment:
      POSTGRES_USER: ragflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragflow_dev}
      POSTGRES_DB: ragflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: thesis-ragflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: thesis-ragflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: thesis-ragflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ragflow:
    image: infiniflow/ragflow:latest
    container_name: thesis-ragflow-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=ragflow
      - PG_PASSWORD=${POSTGRES_PASSWORD:-ragflow_dev}
      - PG_DB=ragflow
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_USER=${MINIO_USER:-minioadmin}
      - MINIO_PASSWORD=${MINIO_PASSWORD:-minioadmin}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
    ports:
      - "9380:9380"
    volumes:
      - ragflowdata:/ragflow/data
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  redisdata:
  miniodata:
  ragflowdata:
